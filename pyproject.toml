[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

# Pin package discovery to discopy* so top-level dirs (benchmark/, plans/, ...)
# don't trip setuptools flat-layout "multiple top-level packages" detection.
[tool.setuptools.packages.find]
include = ["discopy*"]

[project]
name = "discopy"
dynamic = ["version"]
description = "The Python toolkit for computing with string diagrams."
readme = "README.md"
requires-python = ">=3.12"
license =  {file = "LICENSE"}
keywords = [
    "category theory",
    "string diagrams",
    "natural language processing",
    "quantum computing"
]
authors = [
  {name = "DisCoPy"},
  {email = "contact@discopy.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy",
  "networkx",
  "matplotlib",
  "pillow"
]

[dependency-groups]
dev = [
    "coverage",
    "hypothesis",
    "marimo",
    "pyproject-flake8",
    "pylint",
    "pytest",
    "pytest-benchmark",
    "polars",
    "pytest-xdist",
    "ruff == 0.14.0",
    "ty == 0.0.69",
]
docs = ["discopy[docs]"]
notebooks = ["discopy[notebooks]"]
quantum = ["discopy[quantum]"]
grammar = ["discopy[grammar]"]
all = [
    { include-group = "dev" },
    { include-group = "docs" },
    { include-group = "notebooks" },
    { include-group = "quantum" },
    { include-group = "grammar" },
]

[project.optional-dependencies]
quantum = [
    "pytket",
    "pyzx == 0.10.7",
    "sympy",
    "tensornetwork",
    "jax",
    "jaxlib",
    "torch",
    "qiskit",
    "qiskit-aer",
    "pennylane>=0.45.0",
    "pennylane-qiskit>=0.45.0",
    "quimb",
    "qoolqit",
    "scipy",
]
grammar = [
    "nltk",
    "torch",
]
test = [
    "discopy[grammar,quantum]",
    "coverage",
    "hypothesis",
    "marimo",
    "pyproject-flake8",
    "pylint",
    "pytest",
    "pytest-xdist",
]
notebooks = [
    "IPython",
    "anywidget",
    "ipykernel == 6.23.*",
    "marimo",
]
docs  = [
    "discopy[notebooks]",
    "jinja2 == 3.1.*",
    "myst-parser == 2.0.*",
    # executed by marimo when rendering the notebooks at docs build time
    "jax",
    "pytket",
    "scipy",
    "sympy",
    "torch",
    "sphinx == 7.4.*",
    "sphinx-book-theme == 1.1.*",
    "sphinxcontrib-bibtex == 2.5.*",
    "sphinxcontrib-tikz == 0.4.*",
    "sphinxcontrib-youtube == 1.4.*",
]

[tool.setuptools_scm]
version_file = "discopy/version.py"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://discopy.org"
Documentation = "https://docs.discopy.org"
Repository = "https://github.com/discopy/discopy"
Issue-Tracker = "https://github.com/discopy/discopy/issues"
Download = "https://pypi.org/project/discopy"

[tool.flake8]
extend-ignore = [
    "E731",
    "E741",
    "E743",
    "F811",
]
per-file-ignores = [
    "__init__.py:F401"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLE", "PLW", "RUF"]
# The first four are flake8's; the rest are rules `main` breaks today, each
# removed from this list by the pull request that fixes its last instance.
ignore = [
    "E731",
    "E741",
    "E743",
    "F811",
    "B006",
    "B008",
    "B023",
    "B027",
    "B028",
    "B904",
    "B905",
    "E714",
    "PLW0642",
    "PLW1641",
    "PLW2901",
    "PLW3301",
    "RUF001",
    "RUF005",
    "RUF007",
    "RUF010",
    "RUF012",
    "RUF013",
    "RUF017",
    "RUF021",
    "RUF022",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.src]
include = ["discopy"]

[tool.ty.environment]
python-version = "3.12"

# The factory-method pattern narrows the signatures of `then`, `tensor` and
# their friends down the tower, and attributes are dynamic by design where a
# downgrade asks the host category for structure it may not have.
[tool.ty.rules]
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
# The rules `main` breaks today, each set back to "error" by the pull request
# that fixes its last instance.
call-non-callable = "warn"
inconsistent-mro = "warn"
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-generic-class = "warn"
invalid-legacy-type-variable = "warn"
invalid-parameter-default = "warn"
invalid-return-type = "warn"
invalid-type-arguments = "warn"
invalid-type-form = "warn"
invalid-yield = "warn"
missing-argument = "warn"
no-matching-overload = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
too-many-positional-arguments = "warn"
unknown-argument = "warn"
unresolved-import = "warn"
unsupported-operator = "warn"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "test"
]
testpaths = [
    "discopy",
    "test/*.py",
    "test/*/*.py",
]
norecursedirs = [
    ".hypothesis",
    "test/fixtures",
]
addopts = "--doctest-modules --ignore=test/fixtures -p plugin"

[tool.coverage.run]
# The skip paths are unreachable unless --skip-extra is passed, and coverage
# runs the full suite with every extra installed. The egglog reference of
# test/ehypergraph.py runs only where egglog is installed, which the lock does
# not have. torch.compile writes Python under torchinductor_* directories,
# which is not ours to cover.
omit = [
    "test/plugin.py", "test/fixtures/egglog_reference.py",
    "*/torchinductor_*/*"]

[tool.coverage.report]
fail_under = 98
exclude_also = [
    "if TYPE_CHECKING",
]

[tool.marimo.display]
# The docs embed the exported notebooks in iframes, where only the browser's
# prefers-color-scheme reaches: "system" follows it, "light" ignores it.
theme = "system"
