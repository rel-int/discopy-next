name: paper

on:
  push:
    branches: [main]
  pull_request:
    paths:
    - paper/**
    - test/paper_build.py
    - docs/discopy.bib
    - discopy/drawing/**
    - pyproject.toml
    - uv.lock
    - .github/actions/setup/**
    - .github/workflows/paper.yml

permissions:
  contents: read

# Supersede a pull request's own runs, but let every commit on main keep the
# run that proves it green, as the build workflow does.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install LaTeX
      # What paper/preamble.tex loads, and latexmk to run it.
      env:
        PACKAGES: >-
          texlive-latex-base texlive-latex-recommended texlive-latex-extra
          texlive-fonts-recommended texlive-bibtex-extra lmodern latexmk
      run: |
        APT="sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10"
        # shellcheck disable=SC2086  # the package names are words
        $APT install -y --no-install-recommends $PACKAGES \
          || { $APT update && $APT install -y --no-install-recommends $PACKAGES; }
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        groups: all
    - name: Test the paper
      # Its listings, its figures and both compilations: -rs names a skip,
      # and the step below fails where this one skipped a compiler.
      run: uv run pytest test/paper_build.py -rs
    - name: Build both versions
      run: uv run python -m paper.build --pdf
    - name: Upload the paper
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: paper
        path: |
          paper/main.pdf
          paper/latex.pdf
          paper/main.tex
          paper/figures/
        if-no-files-found: error
