name: proptest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Supersede a pull request's own runs, but let every commit on main keep the
# run that proves it green and writes the baseline the next run compares
# against. A dispatch gets a group of its own, since it shares a commit with
# the push that made it and would otherwise queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref
    || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proptest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every run replays what the database remembers and generates the few
      # examples of a pull request on top, from a fixed seed so that a run
      # draws the same examples every time. `explore`'s thousand examples on
      # every cell of the matrix is some 33 hours, so no run searches deeper
      # until the strategies draw better terms for less.
      HYPOTHESIS_PROFILE: pr
      PYTEST_ADDOPTS: --hypothesis-seed=0
      # The repository whose example database the `shared` profile replays:
      # this one, which uploads it below, rather than the default upstream.
      HYPOTHESIS_GITHUB_REPOSITORY: rel-int/discopy-next
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: Download the example database
      uses: dawidd6/action-download-artifact@27e4ae67c24b67d3b54bc6d6a45475be1e28031b # v26
      with:
        name: hypothesis-example-db
        path: .hypothesis/examples
        search_artifacts: true
        workflow_conclusion: completed
        if_no_artifact_found: warn
    - name: Download the previous report
      # The cells the previous run checked, so that this one can name the
      # ones it no longer checks. Missing on the first run and on a branch
      # whose only ancestor runs predate this artifact, which the comparison
      # reports as no baseline rather than failing.
      #
      # Narrower than the database above, because a baseline is a claim about
      # what `main` checks rather than a pile of examples any run may add to.
      # `branch: main` because the action searches every branch without it and
      # a dispatch may be run anywhere, so a feature branch that legitimately
      # skips a cell would otherwise become the baseline that cell is missing
      # from. `success` because the upload below is `always()`: a run that died
      # mid-suite uploads a partial report, which stays available to look at
      # and must not be what the next run compares against.
      uses: dawidd6/action-download-artifact@27e4ae67c24b67d3b54bc6d6a45475be1e28031b # v26
      with:
        name: proptest-report
        path: baseline
        branch: main
        search_artifacts: true
        workflow_conclusion: success
        if_no_artifact_found: warn
    - name: Run property tests
      run:
        uv run pytest proptest/ -n logical -p no:benchmark -vrxX
        --hypothesis-show-statistics
        --proptest-baseline=baseline/proptest-report.json
        --proptest-report=report/proptest-report.json
    - name: Upload the report
      # Written whether the suite passed or not, and uploaded on the same
      # terms as the database below: a pull request reads the shared reading
      # and never rewrites it, since a branch that skips a cell would
      # otherwise make the skip the baseline everyone compares against.
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: proptest-report
        path: report
        retention-days: 90
    - name: Upload the example database
      # A pull request reads the shared memory but never rewrites it: a
      # branch fixing a bug would prune main's memory before it merges, and
      # a fork could upload anything under the artifact's name.
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: hypothesis-example-db
        path: .hypothesis/examples
        include-hidden-files: true
        retention-days: 90
