name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede a pull request's own runs, but let every commit on main keep the
# run that proves it green: cancelling those leaves main with commits nothing
# ever built, as it did on 112b6036.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: actionlint
      env:
        VERSION: 1.7.9
        SCRIPTS: https://raw.githubusercontent.com/rhysd/actionlint
      run: |
        curl -fsSL "$SCRIPTS/v$VERSION/scripts/download-actionlint.bash" \
          | bash -s -- "$VERSION"
        ./actionlint -color
    - name: Check for errors
      run:
        uv run pflake8 .github
    - name: Test
      run:
        uv run --with pyyaml pytest --import-mode=importlib .github/tests/*.py
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: green runs take ~6 min; a job wedged on its first network step reports nothing for hours (#591)
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        groups: dev all
    - name: Check for errors
      run:
        # stop the build if there are Python syntax errors or undefined names
        uv run pflake8 discopy
    - name: pylint
      run:
        uv run pylint discopy
    - name: ruff
      run:
        uv run ruff check discopy
    - name: ty
      run:
        uv run ty check --exit-zero-on-warning
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # backstop: a pull request takes ~3 min, main ~6 for the slow tests and the notebooks ~6 more
    strategy:
      matrix:
        # A pull request tests the version CI lints on; main tests every one.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.12", "3.13", "3.14"]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        groups: dev all
        graphviz: 'true'
    - name: Test
      env:
        # A pull request leaves the tests marked slow to main.
        MARKS: ${{ github.event_name == 'pull_request' && 'not slow' || '' }}
      run:
        # One worker per core; coverage follows them with `patch = subprocess`.
        uv run coverage run -m pytest -n auto --dist worksteal -m "$MARKS"
    - name: Coverage
      run: |
        uv run coverage combine
        uv run coverage report --show-missing
    - name: Test notebooks
      # Execute every marimo notebook and fail if any cell errors, on each
      # commit of main: a pull request is checked by its merge commit.
      if: github.event_name != 'pull_request'
      run:
        uv run python docs/export_notebooks.py --check --jobs 4
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # backstop: a pull request's build takes ~5 min without notebooks; main's renders every notebook one after another, ~13 min more (#445)
    strategy:
      matrix:
        python-version: [ "3.14" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}
        groups: docs
        graphviz: 'true'
    - name: Build
      env:
        # A pull request links to each notebook instead of running it.
        DISCOPY_SKIP_NOTEBOOKS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        # The link pages point at this repository at the commit being built.
        READTHEDOCS_GIT_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}
        READTHEDOCS_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        uv run sphinx-build -j auto docs docs/_build/html
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docs
        path: docs/_build/html
