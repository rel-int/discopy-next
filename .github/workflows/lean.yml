name: lean

on:
  push:
    branches: [main]
  pull_request:
    paths:
    - lean/**
    - discopy/egraph.py
    - benchmark/test_egraph.py
    - benchmark/data/egraph-traces/**
    - discopy/monoidal.py
    - discopy/cat.py
    - pyproject.toml
    - uv.lock
    - .github/actions/setup/**
    - .github/workflows/lean.yml

permissions:
  contents: read

# Supersede a pull request's own runs, but let every commit on main keep the
# run that proves it green, as the build workflow does.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Lean
      # The toolchain of lean/lean-toolchain, from the release it names.
      env:
        VERSION: 4.35.0
        SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
        RELEASES: https://github.com/leanprover/lean4/releases/download
      run: |
        grep -qx "leanprover/lean4:v$VERSION" lean/lean-toolchain
        curl -fsSL -o "$RUNNER_TEMP/lean.tar.zst" \
          "$RELEASES/v$VERSION/lean-$VERSION-linux.tar.zst"
        echo "$SHA256  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
        tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/lean-$VERSION-linux/bin" >> "$GITHUB_PATH"
    - name: Build the proofs and the oracle
      working-directory: lean
      run: lake build
    - name: Audit the axioms
      working-directory: lean
      run: lake env lean Audit.lean
    - uses: ./.github/actions/setup
      with:
        python-version: "3.14"
    - name: Differential test
      env:
        ORACLE_EXAMPLES: 2000
        ORACLE_SEEDS: 0
      run: |
        test -x lean/.lake/build/bin/oracle
        uv run pytest lean/test_oracle.py lean/test_premonoidal.py -s
