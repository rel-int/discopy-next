name: Setup
description: >-
  Install uv, Python and the project, and Graphviz for the jobs that draw
  diagrams. The repository must already be checked out: a local action is
  read from the workspace.
inputs:
  python-version:
    description: The Python version to install.
    required: true
  groups:
    description: The dependency groups to sync, separated by spaces.
    default: dev
  graphviz:
    description: Install Graphviz, which the drawing tests and the docs need.
    default: 'false'
runs:
  using: composite
  steps:
  - name: Setup uv
    uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    with:
      enable-cache: true
      cache-dependency-glob: uv.lock
  - name: Setup Python ${{ inputs.python-version }}
    uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
    with:
      python-version: ${{ inputs.python-version }}
  - name: Install Graphviz
    if: inputs.graphviz == 'true'
    shell: bash
    run: |
      APT="sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10"
      $APT install -y graphviz || { $APT update && $APT install -y graphviz; }
  - name: Install
    shell: bash
    env:
      GROUPS: ${{ inputs.groups }}
    run: |
      args=(--locked)
      for group in $GROUPS; do args+=(--group "$group"); done
      uv sync "${args[@]}"
